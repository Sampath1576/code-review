[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-review-env"
version = "1.0.0"
description = "AI Code Review Environment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openenv-core",
    "requests",
    "openai>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9"
]

[project.scripts]
server = "server.app:main"
